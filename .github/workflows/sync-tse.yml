name: Sincronizar dados e fotos do TSE e publicar site

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar chave diária do cache de fotos
        id: photo-key
        shell: bash
        run: echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restaurar miniaturas oficiais já processadas
        uses: actions/cache@v4
        with:
          path: |
            photos
            .cache/tse-photo-meta.json
          key: tse-photos-2026-v1-${{ steps.photo-key.outputs.day }}
          restore-keys: |
            tse-photos-2026-v1-

      - name: Sincronizar candidaturas do TSE
        run: node scripts/sync-tse.mjs

      - name: Instalar processador de imagens
        run: npm install --no-save --package-lock=false --no-audit --no-fund sharp@0.33.5

      - name: Sincronizar e otimizar fotos oficiais do TSE
        run: node scripts/sync-photos.mjs

      - name: Remover dependências usadas somente na compilação
        run: rm -rf node_modules

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
