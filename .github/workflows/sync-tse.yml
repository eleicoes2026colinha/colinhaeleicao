name: Sincronizar dados do TSE

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/sync-tse.yml'
      - 'index.html'
      - 'app.js'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sincronizar candidatos do TSE
        run: node scripts/sync-tse.mjs
      - name: Salvar atualização no repositório
        run: |
          if git diff --quiet -- data; then
            echo "Sem alterações nos dados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "dados: atualizar candidaturas do TSE"
          git push
